<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MODERN UTILITY | C.P. Company</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/section/detail.css" />
  </head>

  <body>
    <main class="detail">
      <section class="detail_section">
        <div class="detail_inner">
          <!-- 왼쪽 메인 이미지 -->
          <div class="detail_visual">
            <div class="detail_visual_img">
              <img
                id="detailMainImg"
                src="img/collection/00-10/collection-00s-01.webp"
                alt="MODERN UTILITY 메인 이미지"
              />
            </div>
          </div>

          <!-- 오른쪽 전체 영역 -->
          <div class="detail_right">
            <!-- 텍스트 -->
            <div class="detail_content">
              <p class="detail_meta font_en" id="detailMeta">C.P. COMPANY / FW001 / 2001</p>

              <h1 class="detail_title font_en" id="detailTitle">MODERN UTILITY</h1>

              <h2 class="detail_subtitle font_ko" id="detailSubtitle">
                기능성과 현대적인 실루엣의 진화
              </h2>

              <p class="detail_desc font_ko" id="detailDesc">
                <span class="font_en">2000</span>년대 초반
                <span class="font_en">C.P. COMPANY</span>는 기능적인 디자인과 절제된 실루엣을
                결합하며 현대적인 스타일을 선보였습니다. 구조적인 재단과 실용적인 디테일을 중심으로
                전개된 컬렉션은 도시적인 감각과 브랜드 특유의 실험적인 디자인 철학을 보여줍니다.
              </p>
            </div>

            <!-- 보조 이미지 -->
            <div class="detail_gallery">
              <!-- 첫 번째 이미지 -->
              <figure class="detail_card detail_card01">
                <div class="detail_card_img">
                  <img src="img/detail/detail01.webp" alt="C.P. COMPANY 상세 이미지 01" />
                </div>

                <figcaption class="detail_caption font_en">C.P. COMPANY / FW001 / 2001</figcaption>
              </figure>

              <!-- 두 번째 이미지 -->
              <figure class="detail_card detail_card02">
                <div class="detail_card_img">
                  <img src="img/detail/detail02.webp" alt="C.P. COMPANY 상세 이미지 02" />
                </div>

                <figcaption class="detail_caption font_en">C.P. COMPANY / FW001 / 2001</figcaption>
              </figure>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- JS -->
    <script src="./js/detail.js" defer></script>
  </body>
</html>
